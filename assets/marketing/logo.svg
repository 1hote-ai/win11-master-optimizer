<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base Circle -->
  <circle cx="256" cy="256" r="240" fill="#0B0F19" stroke="#1E293B" stroke-width="6"/>

  <!-- Orbital Latency Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00D2FF" stroke-width="2" stroke-dasharray="14 8" opacity="0.4"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.3"/>

  <!-- Outer Protective Shield -->
  <path d="M256 64 L416 128 C416 280 256 424 256 424 C256 424 96 280 96 128 Z"
        fill="url(#shieldGrad)" opacity="0.25"/>
  <path d="M256 64 L416 128 C416 280 256 424 256 424 C256 424 96 280 96 128 Z"
        fill="none" stroke="url(#shieldGrad)" stroke-width="8" stroke-linejoin="round"/>

  <!-- Inner Dynamic Shield -->
  <path d="M256 100 L380 152 C380 270 256 380 256 380 C256 380 132 270 132 152 Z"
        fill="#0F172A" stroke="#38BDF8" stroke-width="4" stroke-linejoin="round"/>

  <!-- High-Performance Pulse Wave / Tachometer Lightning -->
  <g filter="url(#glow)">
    <path d="M240 130 L180 260 L246 260 L220 370 L332 236 L266 236 L300 130 Z"
          fill="url(#coreGrad)"/>
  </g>

  <!-- Precision Tick Dots -->
  <circle cx="256" cy="90" r="4" fill="#00D2FF"/>
  <circle cx="390" cy="140" r="4" fill="#00D2FF"/>
  <circle cx="122" cy="140" r="4" fill="#00D2FF"/>
  <circle cx="256" cy="405" r="4" fill="#10B981"/>
</svg>
