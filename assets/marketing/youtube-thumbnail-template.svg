<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="ytBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="60%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#00182E"/>
    </linearGradient>
    <linearGradient id="ytGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="ytGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#ytBg)"/>

  <!-- High-contrast Glow in Top-Right -->
  <circle cx="1100" cy="150" r="280" fill="#0284C7" opacity="0.25" filter="url(#ytGlow)"/>
  <circle cx="200" cy="600" r="220" fill="#10B981" opacity="0.15" filter="url(#ytGlow)"/>

  <!-- Left Side: Attention-Grabbing Badge -->
  <g transform="translate(80, 80)">
    <rect width="320" height="48" rx="8" fill="#161E2E" stroke="#00D2FF" stroke-width="2"/>
    <text x="30" y="32" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#00D2FF" letter-spacing="1.5">
      WINDOWS 11 (24H2)
    </text>
  </g>

  <!-- Big High-CTR Typography -->
  <g transform="translate(80, 200)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" fill="#FFFFFF" letter-spacing="1">
      МИФЫ ОБ FPS
    </text>
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" fill="#00D2FF" letter-spacing="1">
      И ЧЕСТНЫЙ DPC
    </text>
    <text x="0" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="#94A3B8">
      Что РЕАЛЬНО убирает задержку в играх?
    </text>
  </g>

  <!-- Comparison Pills / Graph on Bottom Left -->
  <g transform="translate(80, 430)">
    <rect width="250" height="70" rx="10" fill="#161E2E" stroke="#EF4444" stroke-width="2"/>
    <text x="24" y="30" font-family="'JetBrains Mono', monospace" font-size="14" fill="#94A3B8">Плацебо-твикеры</text>
    <text x="24" y="55" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#EF4444">1840 µs DPC Lag</text>

    <rect x="280" width="280" height="70" rx="10" fill="#161E2E" stroke="#10B981" stroke-width="2"/>
    <text x="304" y="30" font-family="'JetBrains Mono', monospace" font-size="14" fill="#94A3B8">Win11 Master Opt</text>
    <text x="304" y="55" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#10B981">120 µs Sub-ms DPC</text>
  </g>

  <!-- Right Graphic: 3D Shield + Telemetry Wave Mockup -->
  <g transform="translate(840, 150) scale(0.9)">
    <circle cx="256" cy="256" r="230" fill="#0B0F19" stroke="#1E293B" stroke-width="8"/>
    <circle cx="256" cy="256" r="190" fill="none" stroke="#00D2FF" stroke-width="4" stroke-dasharray="20 12" opacity="0.6"/>
    <path d="M256 64 L416 128 C416 280 256 424 256 424 C256 424 96 280 96 128 Z" fill="#0F172A" stroke="#00D2FF" stroke-width="10" stroke-linejoin="round"/>
    <path d="M240 130 L180 260 L246 260 L220 370 L332 236 L266 236 L300 130 Z" fill="#10B981" filter="url(#ytGlow)"/>
  </g>

  <!-- Watermark / Brand Badge Bottom -->
  <g transform="translate(80, 620)">
    <rect width="360" height="40" rx="6" fill="#0F172A" stroke="#1E293B"/>
    <text x="20" y="26" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#F1F5F9">
      GitHub: 1hote-ai/win11-master-optimizer
    </text>
  </g>
</svg>
