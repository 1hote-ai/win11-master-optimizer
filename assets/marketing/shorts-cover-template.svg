<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <defs>
    <linearGradient id="shBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="35%" stop-color="#0B0F19"/>
      <stop offset="70%" stop-color="#0D1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <filter id="shGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#shBg)"/>

  <!-- Top Ambient Glow -->
  <circle cx="540" cy="300" r="350" fill="#00D2FF" opacity="0.12" filter="url(#shGlow)"/>

  <!-- Safe Zone Guide: Top Category Pill -->
  <g transform="translate(140, 220)">
    <rect width="800" height="70" rx="35" fill="#161E2E" stroke="#00D2FF" stroke-width="3"/>
    <text x="400" y="46" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#00D2FF" letter-spacing="2">
      WINDOWS 11 PRO TIP #01
    </text>
  </g>

  <!-- Big Vertical Hook Title -->
  <g transform="translate(100, 380)">
    <text x="440" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="78" font-weight="900" fill="#FFFFFF" letter-spacing="1">
      ПОЧЕМУ ЛАГАЕТ
    </text>
    <text x="440" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="82" font-weight="900" fill="#00D2FF" letter-spacing="1">
      МЫШКА В ИГРАХ?
    </text>
    <text x="440" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="600" fill="#94A3B8">
      Секрет в IRQ-прерываниях и MSI Mode
    </text>
  </g>

  <!-- Central Graphic: Live Interactive Terminal Snapshot -->
  <g transform="translate(80, 680)">
    <rect width="920" height="640" rx="20" fill="#090D16" stroke="#1E293B" stroke-width="3"/>
    <rect width="920" height="60" rx="20" fill="#0F172A"/>
    <circle cx="40" cy="30" r="8" fill="#EF4444"/>
    <circle cx="65" cy="30" r="8" fill="#F59E0B"/>
    <circle cx="90" cy="30" r="8" fill="#10B981"/>
    <text x="130" y="37" font-family="'JetBrains Mono', monospace" font-size="20" fill="#64748B">Win11 Master Optimizer Suite</text>

    <g transform="translate(40, 110)" font-family="'JetBrains Mono', monospace" font-size="22">
      <text y="0" fill="#38BDF8">>>> ОПТИМИЗАЦИЯ ПРЕРЫВАНИЙ (MSI MODE) &lt;&lt;&lt;</text>
      <text y="50" fill="#E2E8F0">  -> GPU: NVIDIA GeForce RTX 3060</text>
      <text y="90" fill="#10B981">     [OK] MSI Mode: ВКЛ (1) | Приоритет: HIGH (3)</text>
      <text y="140" fill="#E2E8F0">  -> Сеть: Realtek PCIe 2.5GbE Family Controller</text>
      <text y="180" fill="#10B981">     [OK] MSI Mode: ВКЛ (1) | Приоритет: HIGH (3)</text>
      <text y="240" fill="#94A3B8">-------------------------------------------------</text>
      <text y="290" fill="#00D2FF">  DPC Latency: Снижение очереди прерываний</text>
      <text y="340" fill="#10B981">  Плавность сенсора: 1000/2000/4000/8000 Hz READY</text>
      <text y="410" fill="#64748B">[Safety] Снимок сохранен в Backup_MSIMode_*.json</text>
      <text y="460" fill="#38BDF8">[Rollback] Возврат исходного состояния в 1 клик</text>
    </g>
  </g>

  <!-- Call to Action Box (Safe Zone above bottom mobile UI) -->
  <g transform="translate(100, 1420)">
    <rect width="880" height="150" rx="24" fill="#161E2E" stroke="#10B981" stroke-width="3"/>
    <text x="440" y="60" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">
      Скачай бесплатно на GitHub:
    </text>
    <text x="440" y="110" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="30" font-weight="800" fill="#00D2FF">
      github.com/1hote-ai/win11-master-optimizer
    </text>
  </g>

  <!-- Bottom Brand Mark -->
  <g transform="translate(390, 1660) scale(0.6)">
    <circle cx="256" cy="256" r="230" fill="#0B0F19" stroke="#1E293B" stroke-width="6"/>
    <path d="M256 64 L416 128 C416 280 256 424 256 424 C256 424 96 280 96 128 Z" fill="#0F172A" stroke="#00D2FF" stroke-width="8"/>
    <path d="M240 130 L180 260 L246 260 L220 370 L332 236 L266 236 L300 130 Z" fill="#10B981"/>
  </g>
</svg>
