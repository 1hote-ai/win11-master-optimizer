<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A11"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" opacity="0.35"/>
    </pattern>
    <filter id="bannerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="150" cy="210" r="180" fill="#0284C7" opacity="0.12" filter="url(#bannerGlow)"/>
  <circle cx="1050" cy="210" r="160" fill="#10B981" opacity="0.08" filter="url(#bannerGlow)"/>

  <!-- Left Logo Group -->
  <g transform="translate(60, 85) scale(0.48)">
    <circle cx="256" cy="256" r="230" fill="#0B0F19" stroke="#1E293B" stroke-width="6"/>
    <circle cx="256" cy="256" r="200" fill="none" stroke="#00D2FF" stroke-width="3" stroke-dasharray="14 8" opacity="0.5"/>
    <path d="M256 64 L416 128 C416 280 256 424 256 424 C256 424 96 280 96 128 Z" fill="#0F172A" stroke="url(#accentCyan)" stroke-width="8" stroke-linejoin="round"/>
    <path d="M240 130 L180 260 L246 260 L220 370 L332 236 L266 236 L300 130 Z" fill="url(#accentEmerald)" filter="url(#bannerGlow)"/>
  </g>

  <!-- Product Title & Tagline -->
  <text x="340" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="1.5">
    WINDOWS 11 MASTER OPTIMIZER
  </text>
  
  <text x="340" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#00D2FF" letter-spacing="0.5">
    Zero Snake Oil. Pure Latency Reduction &amp; Transparent System Control.
  </text>

  <text x="340" y="218" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" fill="#94A3B8">
    Native NT-Kernel RAM Purge • MSI Interrupts • DWM MPO Fix • Anycast DNS Benchmark • 2-Tier Rollback
  </text>

  <!-- Badges Row -->
  <g transform="translate(340, 250)">
    <!-- Badge 1: Windows 11 24H2 Ready -->
    <rect x="0" y="0" width="175" height="36" rx="6" fill="#161E2E" stroke="#0284C7" stroke-width="1.5"/>
    <circle cx="18" cy="18" r="5" fill="#38BDF8"/>
    <text x="32" y="23" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#F1F5F9">Windows 11 24H2</text>

    <!-- Badge 2: Open Source & Verifiable -->
    <rect x="190" y="0" width="165" height="36" rx="6" fill="#161E2E" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="208" cy="18" r="5" fill="#10B981"/>
    <text x="222" y="23" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#F1F5F9">100% Open Source</text>

    <!-- Badge 3: Two-Tier Rollback -->
    <rect x="370" y="0" width="160" height="36" rx="6" fill="#161E2E" stroke="#6366F1" stroke-width="1.5"/>
    <circle cx="388" cy="18" r="5" fill="#818CF8"/>
    <text x="402" y="23" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#F1F5F9">2-Tier Rollback Engine</text>

    <!-- Badge 4: Zero Bloatware -->
    <rect x="545" y="0" width="145" height="36" rx="6" fill="#161E2E" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="563" cy="18" r="5" fill="#F59E0B"/>
    <text x="577" y="23" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#F1F5F9">Zero Binary Bloat</text>
  </g>

  <!-- Interactive Terminal Snippet Mockup on Right -->
  <g transform="translate(340, 310)">
    <rect x="0" y="0" width="800" height="75" rx="8" fill="#090D16" stroke="#1E293B" stroke-width="1"/>
    <!-- Terminal dots -->
    <circle cx="18" cy="18" r="4" fill="#EF4444"/>
    <circle cx="32" cy="18" r="4" fill="#F59E0B"/>
    <circle cx="46" cy="18" r="4" fill="#10B981"/>
    <text x="65" y="22" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#64748B">PowerShell 7.4 / 5.1 (Elevated Administrator)</text>
    <text x="18" y="50" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="700" fill="#10B981">PS C:\&gt; </text>
    <text x="80" y="50" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#E2E8F0">.\Win11Optimizer.ps1 -Mode HealthCheck</text>
    <text x="430" y="50" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#38BDF8">[26/26 Parameters Audited • Score: 96% Optimal]</text>
  </g>
</svg>
