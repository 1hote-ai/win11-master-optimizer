<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAnim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes step1 { 0%, 15% { opacity: 0; transform: translateY(4px); } 20%, 100% { opacity: 1; transform: translateY(0); } }
      @keyframes step2 { 0%, 35% { opacity: 0; transform: translateY(4px); } 40%, 100% { opacity: 1; transform: translateY(0); } }
      @keyframes step3 { 0%, 55% { opacity: 0; transform: translateY(4px); } 60%, 100% { opacity: 1; transform: translateY(0); } }
      @keyframes step4 { 0%, 75% { opacity: 0; transform: translateY(4px); } 80%, 100% { opacity: 1; transform: translateY(0); } }
      @keyframes barGrow { 0%, 65% { width: 140px; } 85%, 100% { width: 340px; } }
      .cursor-blink { animation: blink 0.9s infinite; }
      .anim-step1 { animation: step1 8s infinite ease-out; }
      .anim-step2 { animation: step2 8s infinite ease-out; }
      .anim-step3 { animation: step3 8s infinite ease-out; }
      .anim-step4 { animation: step4 8s infinite ease-out; }
      .anim-bar { animation: barGrow 8s infinite ease-in-out; }
    </style>
  </defs>

  <rect width="960" height="520" rx="12" fill="url(#bgAnim)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Titlebar -->
  <path d="M0 12 Q0 0 12 0 L948 0 Q960 0 960 12 L960 38 L0 38 Z" fill="#161E2E"/>
  <circle cx="20" cy="19" r="6" fill="#EF4444"/>
  <circle cx="40" cy="19" r="6" fill="#F59E0B"/>
  <circle cx="60" cy="19" r="6" fill="#10B981"/>
  <text x="480" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#94A3B8" text-anchor="middle">
    Win11 Master Optimizer — Interactive Live Demo (v0.1.0-beta)
  </text>

  <!-- Console Stream -->
  <g transform="translate(30, 65)" font-family="'JetBrains Mono', Consolas, monospace" font-size="13">
    <!-- Command Prompt -->
    <text x="0" y="20" fill="#00D2FF">PS C:\Windows11\Optimizer&gt; <tspan fill="#F8FAFC">.\Win11Optimizer.ps1 -Mode AutoGaming -DryRun</tspan></text>

    <!-- Step 1: Safety & Restore Point -->
    <g class="anim-step1">
      <text x="0" y="55" fill="#38BDF8">&gt;&gt;&gt; ПРЕДВАРИТЕЛЬНЫЙ ПРОСМОТР ОПТИМИЗАЦИЙ (-DryRun) &lt;&lt;&lt;</text>
      <text x="0" y="75" fill="#10B981">[Safety] Создание точки восстановления 'AutoGamingPreset'...</text>
      <text x="0" y="95" fill="#94A3B8">  [DRY-RUN] SystemRestorePointCreationFrequency = 0 (обход лимита 24ч)</text>
    </g>

    <!-- Step 2: Kernel Latency & RAM -->
    <g class="anim-step2">
      <text x="0" y="130" fill="#10B981">[GamingLatency] Миграция PCI устройств в MSI Mode (High Priority)...</text>
      <text x="0" y="150" fill="#94A3B8">  [DRY-RUN] GPU: 'NVIDIA GeForce RTX 3060' -&gt; MSISupported=1, DevicePriority=3</text>
      <text x="0" y="170" fill="#94A3B8">  [DRY-RUN] NIC: 'Intel(R) Ethernet I219-V' -&gt; MSISupported=1, DevicePriority=3</text>
      <text x="0" y="190" fill="#94A3B8">  [DRY-RUN] CPU: Win32PrioritySeparation = 38 (0x26), Core Parking Disabled</text>
      <text x="0" y="210" fill="#38BDF8">[RAM Cleaner] In-memory NT-Kernel P/Invoke NtSetSystemInformation(80, ref 4)...</text>
    </g>

    <!-- Step 3: GPU MPO & Network Stack -->
    <g class="anim-step3">
      <text x="0" y="245" fill="#10B981">[GpuDisplay] Отключение DWM Multi-Plane Overlay (MPO)...</text>
      <text x="0" y="265" fill="#94A3B8">  [DRY-RUN] OverlayTestMode = 5 (устранение мерцаний и фризов OBS/Discord)</text>
      <text x="0" y="285" fill="#10B981">[NetworkGaming] Отключение алгоритма Нейгла и оптимизация RSS...</text>
      <text x="0" y="305" fill="#94A3B8">  [DRY-RUN] TcpAckFrequency = 1, TCPNoDelay = 1 на активных адаптерах</text>
    </g>

    <!-- Step 4: Final Summary & Progress Bar -->
    <g class="anim-step4">
      <text x="0" y="345" fill="#00D2FF">========================================================================================</text>
      <text x="0" y="365" fill="#FFFFFF" font-weight="bold">  РЕЗУЛЬТАТ: СИСТЕМА ПОЛНОСТЬЮ ОПТИМИЗИРОВАНА (34/34 ТЕСТОВ ПРОЙДЕНО)</text>
      
      <!-- Progress Bar Graphic -->
      <g transform="translate(0, 385)">
        <text x="0" y="14" fill="#94A3B8">Стабильность задержек:</text>
        <rect x="200" y="2" width="340" height="16" rx="4" fill="#1E293B"/>
        <rect x="200" y="2" class="anim-bar" height="16" rx="4" fill="#10B981"/>
        <text x="560" y="14" fill="#34D399" font-weight="bold">99.8% Frametime Consistency</text>
      </g>

      <text x="0" y="425" fill="#F59E0B">  Двухуровневый откат: JSON-снимок реестра сохранен в Backups\Backup_AutoGaming.json</text>
      <text x="0" y="445" fill="#38BDF8">PS C:\Windows11\Optimizer&gt; <rect x="235" y="432" width="8" height="16" fill="#00D2FF" class="cursor-blink"/></text>
    </g>
  </g>
</svg>